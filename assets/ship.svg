<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="hull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="canopy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Thruster Flames -->
  <path d="M 85 160 Q 100 195 100 195 Q 100 195 115 160 Z" fill="#38bdf8" filter="url(#neonGlow)"/>
  <path d="M 90 160 Q 100 185 100 185 Q 100 185 110 160 Z" fill="#ffffff"/>

  <!-- Left Main Wing -->
  <path d="M 100 30 L 15 140 L 45 155 L 75 120 L 100 160 Z" fill="url(#wing)" stroke="#0284c7" stroke-width="2"/>
  <!-- Right Main Wing -->
  <path d="M 100 30 L 185 140 L 155 155 L 125 120 L 100 160 Z" fill="url(#wing)" stroke="#0284c7" stroke-width="2"/>

  <!-- Wing Cannons -->
  <rect x="10" y="110" width="6" height="35" rx="3" fill="#38bdf8" filter="url(#neonGlow)"/>
  <rect x="184" y="110" width="6" height="35" rx="3" fill="#38bdf8" filter="url(#neonGlow)"/>

  <!-- Main Fuselage -->
  <path d="M 100 10 L 130 110 L 100 165 L 70 110 Z" fill="url(#hull)" stroke="#38bdf8" stroke-width="2"/>

  <!-- Cockpit Canopy Glass -->
  <path d="M 100 40 C 112 60, 112 90, 100 105 C 88 90, 88 60, 100 40 Z" fill="url(#canopy)"/>
  <ellipse cx="96" cy="55" rx="3" ry="12" fill="#ffffff" opacity="0.8"/>

  <!-- Wing Neon Trims -->
  <path d="M 100 35 L 175 135" stroke="#38bdf8" stroke-width="3" fill="none" filter="url(#neonGlow)"/>
  <path d="M 100 35 L 25 135" stroke="#38bdf8" stroke-width="3" fill="none" filter="url(#neonGlow)"/>
</svg>
